<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — HOJA ACADEMY</title>
<link rel="icon" type="image/png" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon.png">
<meta name="robots" content="noindex">
<style>
  /* Jetons alignés sur le système du cockpit (B/C du design system) : le login est
     la porte d'entrée du back-office, pas une identité séparée. Le dégradé
     décoratif a été retiré (contrainte produit : pas de gradients décoratifs). */
  :root{
    --bg:#090d16;--card:#111726;--card-hover:#151d30;--card-2:#0d1322;--elevated:#1a2334;
    --line:#1e293b;--line-strong:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.06);
    --text:#f1f5f9;--text-bright:#ffffff;--muted:#94a3b8;--muted-dark:#7c8ba1;
    --teal:#10b981;--teal-light:#34d399;--teal-soft:rgba(16,185,129,.12);
    --blue:#38bdf8;--blue-soft:rgba(56,189,248,.12);
    --danger:#f43f5e;--danger-soft:rgba(244,63,94,.12);
    --warn:#f59e0b;--warn-soft:rgba(245,158,11,.12);
    --ok:#10b981;--info:#38bdf8;--neutral-soft:rgba(148,163,184,.12);
    --input-bg:#0a101c;--on-accent:#06231a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.24);--shadow:0 4px 12px rgba(0,0,0,.28);--shadow-lg:0 12px 32px rgba(0,0,0,.36);
    --radius-sm:6px;--radius:10px;--radius-lg:14px;--radius-full:999px;--touch-min:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow-lg);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand svg,.brand img{width:34px;height:34px;}
  .brand b{font-size:14px;letter-spacing:.12em;}
  .brand small{display:block;color:var(--teal);font-size:12px;letter-spacing:.3em;}
  h1{font-size:22px;font-weight:700;margin:18px 0 4px;letter-spacing:-.02em;}
  p.lead{color:var(--muted);font-size:14px;margin-bottom:22px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.03em;}
  input{width:100%;min-height:44px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--input-bg);color:var(--text);font-size:16px;font-family:inherit;}
  input:focus{outline:2px solid var(--blue);outline-offset:2px;border-color:transparent;}
  button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:var(--radius);background:var(--teal);color:var(--on-accent);font-weight:800;font-size:16px;letter-spacing:.03em;cursor:pointer;min-height:48px;font-family:inherit;}
  button:disabled{opacity:.55;cursor:wait;}
  .err{display:none;margin-top:16px;padding:12px 14px;border-radius:var(--radius);background:var(--danger-soft);border:1px solid var(--line-strong);color:var(--danger);font-size:14px;}
  .err.on{display:block;}
  .hint{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center;}

/* QA mobile prod — cibles tactiles minimales 44px */
@media (max-width: 768px) { a.btn, button, input[type=submit] { min-height: 44px; } a:not([class]) { padding: 14px 6px; display: inline-block; } }
</style>
</head>
<body>
  <form class="box" id="f" novalidate>
    <div class="brand">
      <img src="/favicon.ico" alt="Hoja Academy">
      <span><b>HOJA ACADEMY</b><small>LEARN AI</small></span>
    </div>
    <h1>Connexion à votre espace</h1>
    <p class="lead">Apprenant ou formateur — identifiants fournis par l'administration.</p>
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required placeholder="vous@exemple.com">
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="btn">Se connecter</button>
    <div style="display:flex;align-items:center;gap:12px;margin:22px 0 4px;color:var(--muted);font-size:12px;letter-spacing:.08em;">
      <span style="flex:1;height:1px;background:var(--line);"></span>ADMINISTRATION<span style="flex:1;height:1px;background:var(--line);"></span>
    </div>
    <a href="/oauth/login" id="gbtn" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:#1f2937;font-weight:700;font-size:14px;text-decoration:none;min-height:48px;">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.72 6c1.9-4.57 6.43-7.72 13.72-7.72z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.28 28.78A14.3 14.3 0 0 1 9.5 24c0-1.67.28-3.29.78-4.78l-7.72-6C1.19 16.65 0 20.18 0 24s1.19 7.35 2.56 10.78l7.72-6z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-7.29 0-11.82-3.15-13.72-7.71l-7.72 6C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuer avec Google
    </a>
    <p class="hint">Réservé aux administrateurs autorisés. Les apprenants et formateurs utilisent leurs identifiants.</p>
  </form>
<script>
const f=document.getElementById('f'), err=document.getElementById('err'), btn=document.getElementById('btn');
const HOME={apprenant:'/ui/campus/', formateur:'/ui/suivi/', admin:'/ui/cockpit/'};
f.addEventListener('submit', async (e)=>{
  e.preventDefault();
  err.classList.remove('on'); btn.disabled=true; btn.textContent='Connexion…';
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:password.value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Identifiants invalides.');
    location.href=HOME[d.role]||'/ui/campus/';
  }catch(ex){ err.textContent=ex.message; err.classList.add('on'); btn.disabled=false; btn.textContent='Se connecter'; }
});
</script>
</body>
</html>
